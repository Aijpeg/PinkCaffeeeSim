    $("bub").innerHTML='«Мне '+c.it.n+', пожалуйста!»<div class="pat"><i id="pat" style="width:'+Math.max(0,c.t/c.mx*100)+'%"></i></div>';
    h='<div class="rec">'+ic("star",3)+' Серия: '+G.run+' '+ic("bell",2)+' · '+ic("flower",3)+' Рекорд: '+G.best+' '+ic("bell",2)+'</div><div class="msg '+G.mc+'">'+G.msg+'</div><div class="tray">'+(G.sel.length?G.sel.map(function(x){return '<b>'+x+'</b>'}).join(""):'<em>Выбери ингредиенты с полки</em>')+'</div>'
     +'<div class="shelf">'+c.shelf.map(function(x,i){return '<button class="'+(G.ex&&G.ex.indexOf(x)>=0?'bad':G.ms&&G.ms.indexOf(x)>=0?'miss':G.sel.indexOf(x)>=0?'on':'')+'" onclick="tog('+i+')">'+x+'</button>'}).join("")+'</div>'
     +(G.lock&&G.mc==="bad"?'<div class="act"><button class="go" onclick="cont()">Далее...</button></div>':'<div class="act"><button onclick="clr()">Сбросить</button><button class="sec" onclick="peek()">Подсмотреть</button><button class="go" onclick="serve()">Подать</button></div>');
  }else{
    var st=G.won?G.hp:0;
    h='<div class="panel"><h2>'+(G.won?'Смена удалась!':'Смена не удалась')+'</h2><div class="big">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</div><p>Всего колокольчиков: <b>'+G.bells+' '+ic("bell",2)+'</b><br>Освоено позиций: <b>'+ms+' из '+GN+'</b><br>Рекорд серии: <b>'+G.best+' '+ic("bell",2)+'</b></p><button class="cta" onclick="brief()">'+(G.won?'Новая смена':'Попробовать снова')+'</button></div>';
  }
  $("ui").innerHTML=h;
}
(function(){var r=document.documentElement.style;[["cl","cloud"],["mu","mush"],["fl","flower"],["st","star"]].forEach(function(a){r.setProperty("--"+a[0],'url("'+uri(a[1],3)+'")')});
document.querySelectorAll(".dc").forEach(function(e){e.innerHTML=ic(e.getAttribute("data-i"),4)})})();
render();
</script>
</body>
</html>
