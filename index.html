@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--sky:#41609f;--grass:#8a5c94;--card:#62508a;--ink:#fff3fa;--mute:#e0cfee;--wood:#5b93cf;--woodd:#4378b0;--line:#8a78b4}}
:root[data-theme="dark"]{color-scheme:dark;--sky:#41609f;--grass:#8a5c94;--card:#62508a;--ink:#fff3fa;--mute:#e0cfee;--wood:#5b93cf;--woodd:#4378b0;--line:#8a78b4}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Rubik,system-ui,-apple-system,sans-serif;font-weight:500;line-height:1.35;background:var(--grass);-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto}
.stage{position:relative;height:44vh;min-height:270px;background:linear-gradient(#a9d4f5,#f6d3ee)}
canvas{display:block;width:100%;height:100%;touch-action:pan-y;image-rendering:pixelated}
#hud{position:absolute;left:24px;right:24px;top:20px;z-index:4;display:flex;justify-content:space-between;background:var(--wood);color:#fff;border-radius:0;padding:6px 14px;box-shadow:0 4px 0 var(--woodd);font-size:.9rem}
#bub{position:absolute;left:26px;right:26px;bottom:22px;z-index:4;background:var(--card);border:3px solid var(--line);border-radius:0;padding:8px 14px;font-weight:600;text-align:center}
.pat{height:8px;background:var(--line);border-radius:0;margin-top:6px;overflow:hidden}
.pat i{display:block;height:100%;width:100%;background:var(--leaf)}
#ui{padding:12px}
h1{font-size:1.9rem;margin:2px 0 6px;line-height:1.1;font-weight:600}
h2{font-size:1.3rem;margin:2px 0 8px;font-weight:600}
p{margin:0 0 12px}
button{font:inherit;color:var(--ink);cursor:pointer;background:var(--card);border:3px solid var(--ink);border-bottom-width:6px;border-radius:0;padding:9px 12px}
button:active{transform:translateY(3px);border-bottom-width:2px}
button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.panel{background:var(--card);border:4px solid var(--ink);border-radius:0;padding:16px;box-shadow:6px 6px 0 var(--woodd)}
.cta{width:100%;background:var(--leaf);border-color:var(--leafd);color:#fff;font-size:1.1rem;font-weight:600;padding:12px}
.sec{background:var(--pop);border-color:var(--popd);font-weight:600}
.row{display:flex;gap:8px;margin-bottom:12px}.row button{flex:1}
.row button.on{background:var(--wood);border-color:var(--woodd);color:#fff}
.msg{min-height:40px;margin:0 2px 6px;font-weight:600}.msg.good{color:var(--leafd)}.msg.bad{color:var(--bad)}
.tray{min-height:54px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;border:3px dashed var(--wood);border-radius:0;padding:8px;margin-bottom:10px;background:var(--card);font-size:.85rem}
.tray b{background:var(--leaf);color:#fff;border-radius:0;padding:3px 10px;font-weight:500}.tray em{color:var(--mute);font-style:normal}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.shelf button{font-size:.98rem;line-height:1.2;padding:9px 6px;border-radius:0}
.shelf button.on{background:var(--leaf);border-color:var(--leafd);color:#fff}
.shelf button.bad{background:#ff5c7a;color:#fff}.shelf button.miss{background:#8ecbf0;color:#2d3f66;outline:3px dashed var(--ink);outline-offset:1px}
#nm{position:absolute;left:0;top:0;pointer-events:none;display:none;background:var(--card);color:var(--ink);border:3px solid var(--ink);padding:2px 10px;font-weight:600;font-size:.95rem;white-space:nowrap;box-shadow:3px 3px 0 var(--woodd)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(90,70,130,.55);overflow:auto;padding:16px 12px}
.ov[hidden]{display:none}.ov .panel{max-width:540px;margin:28px auto 32px}
.pb{padding:2px 10px;border-width:2px;border-bottom-width:4px;font-size:.95rem}
.chips span{display:inline-block;background:var(--card);border:2px solid var(--line);padding:3px 9px;margin:0 5px 6px 0;font-size:.92rem}
.rec{font-weight:600;font-size:.95rem;margin:0 2px 6px;color:var(--mute)}
.frm{position:absolute;inset:0;border:8px solid #6db33f;box-shadow:inset 0 0 0 3px #b6e384;pointer-events:none;z-index:2}
.dc{position:absolute;font-size:26px;line-height:1;z-index:3;pointer-events:none}
svg.px{display:inline-block;vertical-align:-2px;image-rendering:pixelated}
.panel{position:relative}
#ui .panel{margin:26px 0 28px}
.panel::before{content:"";position:absolute;top:-19px;right:16px;width:40px;height:20px;background:var(--cl) center/contain no-repeat;image-rendering:pixelated}
.panel::after{content:"";position:absolute;bottom:-18px;left:16px;width:32px;height:28px;background:var(--mu) center/contain no-repeat;image-rendering:pixelated}
.panel h1::after,.panel h2::after{content:"";display:block;height:14px;margin-top:6px;background:var(--fl) 0 center/14px 14px repeat-x;image-rendering:pixelated}
.cta::before{content:"";display:inline-block;width:18px;height:18px;margin-right:8px;vertical-align:-3px;background:var(--st) center/contain no-repeat;image-rendering:pixelated}
.act{display:flex;gap:8px;margin-top:12px}.act button{flex:1;font-weight:600}.act .go{flex:1.5;background:var(--leaf);border-color:var(--leafd);color:#fff}
.it{background:var(--card);border:2px solid var(--line);border-radius:0;padding:9px 13px;margin-bottom:8px}.it small{display:block;color:var(--mute);font-size:.86rem}
.big{font-size:2.3rem;margin:4px 0}
</style>

    $("bub").innerHTML='«Мне '+c.it.n+', пожалуйста!»<div class="pat"><i id="pat" style="width:'+Math.max(0,c.t/c.mx*100)+'%"></i></div>';
    h='<div class="rec">'+ic("star",3)+' Серия: '+G.run+' '+ic("bell",2)+' · '+ic("flower",3)+' Рекорд: '+G.best+' '+ic("bell",2)+'</div><div class="msg '+G.mc+'">'+G.msg+'</div><div class="tray">'+(G.sel.length?G.sel.map(function(x){return '<b>'+x+'</b>'}).join(""):'<em>Выбери ингредиенты с полки</em>')+'</div>'
     +'<div class="shelf">'+c.shelf.map(function(x,i){return '<button class="'+(G.ex&&G.ex.indexOf(x)>=0?'bad':G.ms&&G.ms.indexOf(x)>=0?'miss':G.sel.indexOf(x)>=0?'on':'')+'" onclick="tog('+i+')">'+x+'</button>'}).join("")+'</div>'
     +(G.lock&&G.mc==="bad"?'<div class="act"><button class="go" onclick="cont()">Далее...</button></div>':'<div class="act"><button onclick="clr()">Сбросить</button><button class="sec" onclick="peek()">Подсмотреть</button><button class="go" onclick="serve()">Подать</button></div>');
  }else{
    var st=G.won?G.hp:0;
    h='<div class="panel"><h2>'+(G.won?'Смена удалась!':'Смена не удалась')+'</h2><div class="big">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</div><p>Колокольчики: <b>'+G.bells+' '+ic("bell",2)+'</b><br>Освоено позиций: <b>'+ms+' из '+M.length+'</b><br>Рекорд серии: <b>'+G.best+' '+ic("bell",2)+'</b></p><button class="cta" onclick="brief()">'+(G.won?'Новая смена':'Попробовать снова')+'</button></div>';
  }
  $("ui").innerHTML=h;
}
(function(){var r=document.documentElement.style;[["cl","cloud"],["mu","mush"],["fl","flower"],["st","star"]].forEach(function(a){r.setProperty("--"+a[0],'url("'+uri(a[1],3)+'")')});
document.querySelectorAll(".dc").forEach(function(e){e.innerHTML=ic(e.getAttribute("data-i"),4)})})();
render();
</script>
</body>
</html>
